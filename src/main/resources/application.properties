spring.application.name=HMA-PaymentAPI

server.port=8090
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.url=jdbc:${DB_TYPE}://localhost:${DB_PORT}/${DB_NAME}

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=${DIALECT}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.instance.hostname= localhost
eureka.client.register-with-eureka= true
eureka.client.fetch-registry= true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

resilience4j.circuitbreaker.instances.customerServiceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.customerServiceCircuitBreaker.failure-rate-threshold=50

# Wait 10 seconds in OPEN state before trying to route traffic again (HALF-OPEN)
resilience4j.circuitbreaker.instances.customerServiceCircuitBreaker.wait-duration-in-open-state=10000

# Total number of attempts (1 original call + 2 retries)
resilience4j.retry.instances.customerServiceRetry.max-attempts=3
# Wait 2 seconds (2000 ms) before trying again
resilience4j.retry.instances.customerServiceRetry.wait-duration=3000


# Allow a maximum of 3 calls
resilience4j.ratelimiter.instances.customerServiceRateLimiter.limit-for-period=30
# The refresh period window (10 seconds)
resilience4j.ratelimiter.instances.customerServiceRateLimiter.limit-refresh-period=10s
# If a request gets blocked, how long should it wait in line before failing immediately (0 means fail instantly)
resilience4j.ratelimiter.instances.customerServiceRateLimiter.timeout-duration=50ms
# Enable an event consumer buffer size of 10 events i.e. history
resilience4j.ratelimiter.instances.customerServiceRateLimiter.subscribe-for-events=true
resilience4j.ratelimiter.instances.customerServiceRateLimiter.event-consumer-buffer-size=30

management.tracing.sampling.probability= 1.0
spring.cloud.openfeign.micrometer.enabled=true

spring.cloud.stream.bindings.bookingPayment-out-0.destination=booking.payment
spring.cloud.stream.function.bindings.bookingPayment-out-0.destination=booking.payment